# LOCAL policy, not the original BubbleFighter server reward formula.
# Pass --match-rules <path>. Omitted keys retain these defaults.
# Exact key=value syntax; no spaces, duplicate keys, signs or inline comments.
ExperiencePerLevel=1000
MaximumLevel=260
CompletionExperience=100
CompletionLucci=50
WinExperience=25
WinLucci=10
PangExperience=10
PangLucci=5
RescueExperience=5
RescueLucci=2
# Result-only contribution = bubbles + 2*pangs + 2*rescues. Deaths do not subtract.
# Grade minimums must strictly decrease; below E is F. Native frames: SSS=0 .. F=8.
GradeSSSMinimum=60
GradeSSMinimum=40
GradeSMinimum=30
GradeAMinimum=20
GradeBMinimum=10
GradeCMinimum=5
GradeDMinimum=3
GradeEMinimum=1
# Award at most one medal: highest tier, then count; ties prefer rescue/pang/bubble.
# Each category's thresholds must strictly increase. No eligible count means no medal.
MedalBubbleBeginnerMinimum=3
MedalBubbleExpertMinimum=10
MedalBubbleMasterMinimum=20
MedalPangBeginnerMinimum=3
MedalPangExpertMinimum=10
MedalPangMasterMinimum=20
MedalRescueBeginnerMinimum=3
MedalRescueExpertMinimum=10
MedalRescueMasterMinimum=20
